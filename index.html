<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Porcão</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
    }
    header {
      background-color: #8B0000;
      color: white;
      padding: 1rem;
      text-align: center;
      width: 100%;
    }
    main {
      flex: 2;
      padding: 1rem;
    }
    .item {
      border-bottom: 1px solid #ccc;
      padding: 1rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    aside {
      flex: 1;
      background-color: #f5f5f5;
      padding: 1rem;
      border-left: 2px solid #ccc;
    }
    .cart-item {
      margin: 0.5rem 0;
    }
    button {
      background-color: #8B0000;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      margin-left: 0.5rem;
      margin-top: 0.5rem;
    }
    button:hover {
      background-color: #a30000;
    }
    select {
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <div style="width: 100%">
    <header>
      <h1>O Porcão</h1>
    </header>
    <div style="display: flex">
      <main>
        <div class="item">
          <span>Torresmo Crocante - R$30</span>
          <div>
            <select id="torresmo-size">
              <option value="Pequeno">Pequeno</option>
              <option value="Médio">Médio</option>
              <option value="Grande">Grande</option>
            </select>
            <button onclick="addToCartWithSize('Torresmo Crocante', 30, 'torresmo-size')">Adicionar</button>
          </div>
        </div>
        <div class="item">
          <span>Salsicha Cru - R$20</span>
          <button onclick="addToCart('Salsicha Cru', 20)">Adicionar</button>
        </div>
        <div class="item">
          <span>Ovo de Codorna - R$10</span>
          <button onclick="addToCart('Ovo de Codorna', 10)">Adicionar</button>
        </div>
        <div class="item">
          <span>Restos de Comida - R$5</span>
          <button onclick="addToCart('Restos de Comida', 5)">Adicionar</button>
        </div>
      </main>
      <aside>
        <h2>Carrinho</h2>
        <div id="cart"></div>
        <p><strong>Total: R$<span id="total">0</span></strong></p>
        <button onclick="checkout()">Finalizar Pedido</button>
        <button onclick="clearCart()">Limpar Pedido</button>
      </aside>
    </div>
  </div>

  <script>
    let cart = [];

    function addToCart(item, price) {
      cart.push({ item, price });
      renderCart();
    }

    function addToCartWithSize(item, price, selectId) {
      const size = document.getElementById(selectId).value;
      cart.push({ item: `${item} (${size})`, price });
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cart');
      cartDiv.innerHTML = '';
      let total = 0;
      cart.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerText = `${entry.item} - R$${entry.price}`;
        cartDiv.appendChild(div);
        total += entry.price;
      });
      document.getElementById('total').innerText = total;
    }

   function checkout()  {
    const nome = prompt("Digite seu nome:");
    const endereco = prompt("Digite seu endereço de entrega:");
    if (!nome || !endereco) {
      alert("Por favor, preencha todas as informações do pedido.");
      return;
    }
    let pedido = cart.map(c => `${c.item} - R$${c.price}`).join('\n');
    let total = cart.reduce((sum, c) => sum + c.price, 0);
    let mensagem = encodeURIComponent(`Novo pedido de ${nome}:%0A${pedido}%0ATotal: R$${total}%0AEndereço: ${endereco}`);
    window.open(`https://wa.me/5511971113109?text=${mensagem}`, '_blank');
  }	

    function clearCart() {
      if (confirm('Tem certeza que deseja limpar o pedido?')) {
        cart = [];
        renderCart();
      }
    }
  </script>
</body>
</html>
